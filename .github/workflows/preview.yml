name: Preview (stills + video + audio mix + QA gate)

on:
  workflow_dispatch:
    inputs:
      scenes:
        description: "Scene range, e.g. 1-10 or all"
        default: "1-10"
      chunks:
        description: "Parallel render jobs (max 20)"
        default: "20"
      scale:
        description: "Render scale (1 = 1920x1080)"
        default: "1"
      extra_stills:
        description: "Extra stills comp:frame,comp:frame (optional)"
        default: ""
      video:
        description: "Render preview video too (true/false)"
        default: "true"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      start: ${{ steps.m.outputs.start }}
      end: ${{ steps.m.outputs.end }}
      stills: ${{ steps.m.outputs.stills }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: node scripts/matrix.mjs "${{ inputs.scenes }}" "${{ inputs.chunks }}"

  stills:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Procedural SFX (scripts/sfx.py)
        run: pip install -q numpy scipy && python scripts/sfx.py
      - name: Bundle once
        run: npx remotion bundle src/index.ts --out-dir=bundle
      - name: Render stills
        run: |
          mkdir -p stills
          LIST="${{ needs.plan.outputs.stills }}"
          EXTRA="${{ inputs.extra_stills }}"
          for item in $(echo "$LIST" | tr ',' ' '); do
            id=${item%%:*}; fr=${item##*:}
            npx remotion still bundle GothamCop "stills/${id}.jpg" --frame=$fr --image-format=jpeg --jpeg-quality=88 --log=error &
            while [ $(jobs -r | wc -l) -ge 4 ]; do sleep 1; done
          done
          for item in $(echo "$EXTRA" | tr ',' ' '); do
            comp=${item%%:*}; fr=${item##*:}
            npx remotion still bundle "$comp" "stills/x_${comp}_${fr}.jpg" --frame=$fr --image-format=jpeg --jpeg-quality=88 --log=error &
            while [ $(jobs -r | wc -l) -ge 4 ]; do sleep 1; done
          done
          wait
          ls -la stills
      - uses: actions/upload-artifact@v4
        with: { name: stills, path: stills }

  render:
    needs: plan
    if: ${{ inputs.video == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Procedural SFX (scripts/sfx.py)
        run: pip install -q numpy scipy && python scripts/sfx.py
      - name: Render chunk ${{ matrix.idx }} (${{ matrix.from }}-${{ matrix.to }})
        run: |
          mkdir -p parts
          npx remotion render src/index.ts GothamCop parts/part_${{ matrix.idx }}.mp4 \
            --frames=${{ matrix.from }}-${{ matrix.to }} --scale=${{ inputs.scale }} --muted \
            --concurrency=4 --crf=18 --jpeg-quality=95 --log=error
      - uses: actions/upload-artifact@v4
        with: { name: "part-${{ matrix.idx }}", path: parts }

  audio:
    needs: plan
    if: ${{ inputs.video == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Procedural SFX (scripts/sfx.py)
        run: pip install -q numpy scipy && python scripts/sfx.py
      - name: Render full audio mix (narration + beds + foley) for the range
        run: |
          mkdir -p aud
          npx remotion render src/index.ts GothamCop aud/mix.wav --codec=wav \
            --frames=${{ needs.plan.outputs.start }}-${{ needs.plan.outputs.end }} --log=error
          ls -la aud
      - uses: actions/upload-artifact@v4
        with: { name: audio-mix, path: aud }

  combine:
    needs: [plan, render, audio]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/download-artifact@v4
        with: { pattern: "part-*", path: parts, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { name: audio-mix, path: aud }
      - name: Concat + loudness-normalised stereo 48 kHz mix
        run: |
          ls parts | sort | sed "s/^/file 'parts\//; s/$/'/" > list.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i list.txt -c copy video.mp4
          # two-pass loudnorm to -14 LUFS / -1 dBTP
          J=$(ffmpeg -hide_banner -i aud/mix.wav -af loudnorm=I=-14:TP=-1:LRA=11:print_format=json -f null - 2>&1 | sed -n '/^{/,/^}/p')
          MI=$(echo "$J" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['input_i'])")
          MTP=$(echo "$J" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['input_tp'])")
          MLRA=$(echo "$J" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['input_lra'])")
          MTH=$(echo "$J" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['input_thresh'])")
          # linear gain to -14 LUFS, then a true-peak-safe limiter at -1 dBTP (no pumping)
          G=$(python3 -c "print(round(-14.2 - float('$MI'), 2))")
          echo "measured $MI LUFS -> gain $G dB"
          ffmpeg -y -loglevel error -i aud/mix.wav -af "volume=${G}dB,alimiter=limit=0.82:attack=4:release=60:level=false,aresample=48000" -ac 2 -ar 48000 mix_norm.wav
          ffmpeg -y -loglevel error -i video.mp4 -i mix_norm.wav -map 0:v -map 1:a -c:v copy -c:a aac -b:a 320k -ar 48000 -ac 2 -shortest -movflags +faststart preview.mp4
          ls -la preview.mp4
      - uses: actions/upload-artifact@v4
        with: { name: preview-video, path: preview.mp4 }
      - name: Automated QA gate
        id: qa
        continue-on-error: true
        run: python3 scripts/qa.py preview.mp4 qa
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: qa, path: qa }
