name: Align narration (stable-ts)

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Whisper model used for forced alignment"
        default: "medium.en"
        required: false

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/align.yml
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install stable-ts (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install stable-ts
      - uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-${{ inputs.model }}
      - name: Forced alignment + scene retiming
        run: python scripts/align.py "${{ inputs.model }}" | tee alignment-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: alignment
          path: |
            alignment-report.txt
            src/data/alignment.json
            src/data/scenes.json
            src/data/stable_ts_raw.json
      - name: Commit retimed scenes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/alignment.json src/data/scenes.json src/data/stable_ts_raw.json
          git commit -m "Align scenes to narration (stable-ts ${{ inputs.model }})" || echo "nothing to commit"
          git push
